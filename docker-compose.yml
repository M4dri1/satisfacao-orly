services:
  postgres:
    image: postgres:16-alpine
    container_name: orly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orly
      POSTGRES_PASSWORD: orly_dev_password
      POSTGRES_DB: satisfacaoorly
    ports:
      - "5432:5432"
    volumes:
      - orly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orly -d satisfacaoorly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orly_postgres_data:
